
name: Aplicar capa no Notion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem alterar paginas"
        type: boolean
        default: true
        required: true
      max_pages:
        description: "Maximo de paginas por execucao"
        type: number
        default: 10
        required: true

permissions:
  contents: read

jobs:
  apply_cover:
    runs-on: ubuntu-latest

    steps:
      - name: Sincronizar capas
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_UNDERSCORE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_PAGES: ${{ inputs.max_pages }}
          COVER_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          token = os.environ.get("NOTION_TOKEN")
          if not token:
              raise SystemExit("Token do Notion ausente.")

          dry_run = os.environ["DRY_RUN"].lower() == "true"
          limit = int(os.environ["MAX_PAGES"])

          if not 1 <= limit <= 100:
              raise SystemExit("Use um limite entre 1 e 100.")

          base_url = (
              "https://raw.githubusercontent.com/"
              "clezari/uhuu-sim/main/Cover.webp"
          )
          legacy_url = (
              "https://clezari.github.io/"
              "uhuu-sim/Cover.webp"
          )

          version = os.environ["COVER_VERSION"][:12]
          cover_url = base_url + "?v=" + version

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2026-03-11",
              "Content-Type": "application/json",
          }

          def api(method, path, data):
              url = "https://api.notion.com/v1" + path
              payload = json.dumps(data).encode("utf-8")

              for attempt in range(5):
                  request = urllib.request.Request(
                      url,
                      data=payload,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(
                          request, timeout=30
                      ) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 429 and attempt < 4:
                          delay = float(
                              error.headers.get("Retry-After", "2")
                          )
                          time.sleep(max(delay, 1))
                          continue
                      detail = error.read().decode("utf-8")
                      raise RuntimeError(
                          f"HTTP {error.code}: {detail}"
                      )

              raise RuntimeError("Tentativas excedidas.")

          cursor = None
          found = 0
          candidates = []
          custom = 0
          current = 0

          while True:
              body = {
                  "page_size": 100,
                  "filter": {
                      "property": "object",
                      "value": "page",
                  },
              }
              if cursor:
                  body["start_cursor"] = cursor

              result = api("POST", "/search", body)

              for page in result.get("results", []):
                  if page.get("in_trash"):
                      continue

                  found += 1
                  cover = page.get("cover")

                  if not cover:
                      candidates.append(page)
                      continue

                  if cover.get("type") != "external":
                      custom += 1
                      continue

                  url = cover.get(
                      "external", {}
                  ).get("url", "")

                  managed = (
                      url.split("?")[0]
                      in (base_url, legacy_url)
                  )

                  if not managed:
                      custom += 1
                  elif url == cover_url:
                      current += 1
                  else:
                      candidates.append(page)

              if not result.get("has_more"):
                  break

              cursor = result.get("next_cursor")
              if not cursor:
                  raise RuntimeError("Erro de paginacao.")

          print("Paginas encontradas:", found)
          print("Capas personalizadas preservadas:", custom)
          print("Capas padrao ja atualizadas:", current)
          print("Paginas candidatas:", len(candidates))
          print("Simulacao:", dry_run)

          selected = candidates[:limit]
          updated = 0

          for page in selected:
              page_id = page["id"]

              if dry_run:
                  print("SIMULACAO:", page_id)
                  continue

              api(
                  "PATCH",
                  f"/pages/{page_id}",
                  {
                      "cover": {
                          "type": "external",
                          "external": {"url": cover_url},
                      }
                  },
              )
              updated += 1
              print("Atualizada:", page_id)
              time.sleep(0.4)

          print("Paginas atualizadas:", updated)
          print("Execucao concluida.")
          PY
