
name: Aplicar capa no Notion

on:
  push:
    paths:
      - 'Cover.webp'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem alterar paginas"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: notion-cover-sync
  cancel-in-progress: false

jobs:
  apply_cover:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Sincronizar todas as capas
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_UNDERSCORE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          COVER_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import random
          import urllib.request
          import urllib.error

          token = os.environ.get("NOTION_TOKEN")
          if not token:
              raise SystemExit("Token do Notion ausente.")

          dry_run = os.environ["DRY_RUN"].lower() == "true"

          base_url = (
              "https://raw.githubusercontent.com/"
              "clezari/uhuu-sim/main/Cover.webp"
          )

          legacy_url = (
              "https://clezari.github.io/"
              "uhuu-sim/Cover.webp"
          )

          version = os.environ["COVER_VERSION"][:12]
          cover_url = base_url + "?v=" + version

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2026-03-11",
              "Content-Type": "application/json",
          }

          def api(method, path, data):
              url = "https://api.notion.com/v1" + path
              payload = json.dumps(data).encode("utf-8")

              for attempt in range(8):
                  request = urllib.request.Request(
                      url,
                      data=payload,
                      headers=headers,
                      method=method,
                  )

                  try:
                      with urllib.request.urlopen(
                          request, timeout=45
                      ) as response:
                          return json.load(response)

                  except urllib.error.HTTPError as error:
                      if error.code == 429:
                          delay = float(
                              error.headers.get(
                                  "Retry-After", "3"
                              )
                          )
                      elif error.code in (500, 502, 503, 504):
                          delay = min(2 ** attempt, 30)
                      else:
                          detail = error.read().decode("utf-8")
                          raise RuntimeError(
                              f"HTTP {error.code}: {detail}"
                          )

                      if attempt == 7:
                          raise RuntimeError(
                              f"API indisponivel: HTTP {error.code}"
                          )

                      time.sleep(delay + random.uniform(0, 0.3))

              raise RuntimeError("Tentativas excedidas.")

          def get_cover_url(page):
              cover = page.get("cover")

              if not cover:
                  return None, None

              kind = cover.get("type")
              url = cover.get(kind, {}).get("url", "")

              return kind, url

          print("Iniciando sincronizacao")
          print("Simulacao:", dry_run)

          cursor = None
          found = 0
          custom = 0
          current = 0
          candidates = []

          while True:
              body = {
                  "page_size": 100,
                  "filter": {
                      "property": "object",
                      "value": "page",
                  },
              }

              if cursor:
                  body["start_cursor"] = cursor

              result = api("POST", "/search", body)

              for page in result.get("results", []):
                  if page.get("in_trash"):
                      continue

                  found += 1

                  kind, url = get_cover_url(page)

                  if kind is None:
                      candidates.append(page)
                      continue

                  if kind != "external":
                      custom += 1
                      continue

                  managed = (
                      url.split("?")[0]
                      in (base_url, legacy_url)
                  )

                  if not managed:
                      custom += 1
                  elif url == cover_url:
                      current += 1
                  else:
                      candidates.append(page)

              if not result.get("has_more"):
                  break

              cursor = result.get("next_cursor")

              if not cursor:
                  raise RuntimeError("Erro de paginacao.")

          print("Paginas encontradas:", found)
          print("Capas personalizadas:", custom)
          print("Capas padrao atualizadas:", current)
          print("Paginas candidatas:", len(candidates))

          if dry_run:
              print("SIMULACAO: nenhuma pagina alterada")
              print("Execucao concluida.")
              raise SystemExit(0)

          updated = 0
          errors = 0

          for index, page in enumerate(candidates, 1):
              page_id = page["id"]

              try:
                  api(
                      "PATCH",
                      f"/pages/{page_id}",
                      {
                          "cover": {
                              "type": "external",
                              "external": {
                                  "url": cover_url
                              },
                          }
                      },
                  )
                  updated += 1

              except Exception as error:
                  errors += 1
                  print(
                      f"Erro na pagina {page_id}: {error}",
                      flush=True,
                  )

              if index % 100 == 0:
                  print(
                      f"Progresso: {index}/{len(candidates)}",
                      flush=True,
                  )

              time.sleep(0.4)

          print("Paginas atualizadas:", updated)
          print("Erros:", errors)
          print("Sincronizacao concluida.")

          if errors:
              raise SystemExit(
                  f"Execucao com {errors} erros."
              )
          PY
